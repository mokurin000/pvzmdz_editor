name: 🛠 Build & Release

on:
  push:
    branches: [main, master]
    paths:
      - /assets
      - /lib
      - /pubspec.yaml
      - /pubspec.lock
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    uses: ./.github/workflows/windows.yaml

  android:
    uses: ./.github/workflows/android.yaml
